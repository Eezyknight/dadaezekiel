version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # TanStack Start is SSR — nitro emits Amplify's compute layout
        # (.amplify-hosting/{deploy-manifest.json,compute/default,static}).
        # Requires the Amplify app's platform to be WEB_COMPUTE.
        - NITRO_PRESET=aws-amplify npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
